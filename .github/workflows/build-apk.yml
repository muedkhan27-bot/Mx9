name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR_VERSION"
          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "Error: Unable to detect Java version."
            exit 1
          fi
          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_MAJOR_VERSION) is lower than 17."
            exit 1
          fi
          echo "Java 17 or newer verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "debug.keystore not found. Creating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            echo "Discovered APK files in app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Debug APK exists but is empty ($EXPECTED_APK)"
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: File does not have .apk extension"; exit 1 ;;
          esac
          echo "Verified APK at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${RUNNER_TEMP}/release_assets"
          mkdir -p "$TEMP_DIR"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr -c '[:alnum:]_.-' '-' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_PATH="${TEMP_DIR}/${RELEASE_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"
          if [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty at $RELEASE_ASSET_PATH"
            exit 1
          fi
          echo "asset_path=${RELEASE_ASSET_PATH}" >> $GITHUB_OUTPUT
          echo "asset_name=${RELEASE_FILENAME}" >> $GITHUB_OUTPUT
          echo "Prepared release asset: ${RELEASE_ASSET_PATH}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset is missing or empty ($ASSET_PATH)"
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Asset does not have .apk extension"; exit 1 ;;
          esac
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
### Debug APK Build #${GITHUB_RUN_NUMBER}
- **Build Type**: Automatically generated debug APK built by GitHub Actions
- **Run Number**: ${GITHUB_RUN_NUMBER}
- **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
- **Source Commit**: ${GITHUB_SHA}
- **Purpose**: Testing & Verification
- **Notice**: This is not a Play Store production release; it is signed only with a temporary debug keystore.
EOF
)
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$RELEASE_TAG"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
            echo "## 🚀 Debug APK Build & Release Summary" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Release Published Successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page**: [$RELEASE_TAG]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Download APK**: You can download \`$ASSET_NAME\` directly from the **Assets** section on the release page." >> $GITHUB_STEP_SUMMARY
            echo "- **Backup Artifact**: The standard Actions artifact \`app-debug-apk\` is also available for download in this workflow run." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing did not complete or encountered an error."
            echo "APK build succeeded and the artifact 'app-debug-apk' remains available."
            echo "## 🚀 Debug APK Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **GitHub Release publishing did not complete.**" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Build**: Succeeded ✅" >> $GITHUB_STEP_SUMMARY
            echo "- **Actions Artifact**: The debug APK is safely stored as a workflow artifact named \`app-debug-apk\`. You can download it from the Summary tab of this Actions run." >> $GITHUB_STEP_SUMMARY
          fi
